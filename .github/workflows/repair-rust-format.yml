name: Format Rust source (temporary)

on:
  push:
    branches:
      - feat/initial-browser-mcp-http
    paths:
      - .github/workflows/repair-rust-format.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - name: Apply pinned rustfmt to Rust sources
        run: |
          cargo fmt --all
          cargo fmt --all
      - name: Verify formatting is now clean
        run: cargo fmt --all -- --check
      - name: Commit formatted code
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.rs'
          if git diff --cached --quiet; then
            echo "No formatting changes required"
          else
            git commit -m "style: format Rust sources with pinned rustfmt"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
