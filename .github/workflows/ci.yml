name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      codex_consumer_proof:
        description: Run the opt-in disposable Codex stdio MCP consumer journey instead of the full repository suite
        required: false
        default: false
        type: boolean
      linux_x64_deployment:
        description: Build a one-shot prebuilt Linux x86_64 stdio package for the selected Codex consumer
        required: false
        default: false
        type: boolean
      linux_arm64_deployment:
        description: Build a one-shot prebuilt Linux ARM64 stdio package for the selected Codex consumer
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    if: ${{ github.event_name != 'workflow_dispatch' || github.ref != 'refs/heads/main' || (inputs.codex_consumer_proof != true && inputs.linux_x64_deployment != true && inputs.linux_arm64_deployment != true) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: Install Rust toolchain
        run: rustup show active-toolchain
      - name: Reject unresolved dependency graph
        run: test ! -e Cargo.lock.pending
      - name: Install locked JavaScript dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify shared tool schemas
        run: npm run check:catalog
      - name: Check Rust formatting
        run: cargo fmt --all -- --check
      - name: Compile and test Rust host
        run: cargo test --locked --all-targets
      - name: Verify stdio-only compilation
        run: cargo test --locked --no-default-features --lib
      - name: Check Rust warnings
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Install test browser
        # GitHub's ubuntu-24.04 image already includes the required Chromium libraries.
        # Do not apt-upgrade the hosted image during every CI run.
        run: npx playwright install chromium
      - name: Exercise worker and actual MCP browser calls
        run: npm test
        env:
          SEDNA_BROWSER_BINARY: ${{ github.workspace }}/target/debug/sedna-browser-mcp
          # Hosted Ubuntu runners block Chromium's user-namespace sandbox.
          # This override is scoped strictly to ephemeral CI fixture browsers;
          # all deployed browser sessions remain sandboxed by default.
          SEDNA_BROWSER_NO_SANDBOX: 'true'
      - name: Verify source packaging
        run: python3 scripts/package.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: success()
        with:
          name: sedna-browser-mcp-source
          path: dist/*-source.zip
          if-no-files-found: error
          retention-days: 14

  codex-consumer-proof:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.codex_consumer_proof == true }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: Install Rust toolchain
        run: rustup show active-toolchain
      - name: Install locked JavaScript dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build the exact Browser MCP candidate
        run: cargo build --locked --bin sedna-browser-mcp
      - name: Install fixture Chromium
        run: npx playwright install chromium
      - name: Exercise the exact released Codex stdio consumer
        run: npm exec --yes --package=@openai/codex@0.163.0 -- node tests/codex_stdio_journey.mjs
        env:
          SEDNA_BROWSER_BINARY: ${{ github.workspace }}/target/debug/sedna-browser-mcp
          # Scoped to this disposable local-fixture browser only.
          SEDNA_BROWSER_NO_SANDBOX: 'true'

  package-linux:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && (inputs.linux_x64_deployment == true || inputs.linux_arm64_deployment == true) }}
    strategy:
      fail-fast: false
      matrix:
        architecture: ${{ fromJSON(inputs.linux_x64_deployment == true && inputs.linux_arm64_deployment == true && '["x86_64","aarch64"]' || inputs.linux_arm64_deployment == true && '["aarch64"]' || '["x86_64"]') }}
    runs-on: ${{ matrix.architecture == 'aarch64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Reject unresolved dependency graph
        run: test ! -e Cargo.lock.pending
      - name: Install locked JavaScript dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build release host
        run: cargo build --locked --release --bin sedna-browser-mcp
      - name: Install the locked Playwright Chromium runtime
        run: npx playwright install chromium
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/sedna-browser-mcp-playwright-browsers
      - name: Assemble and checksum the target package
        id: package
        shell: bash
        run: |
          set -euo pipefail
          architecture="${{ matrix.architecture }}"
          case "${architecture}" in
            x86_64) expected_uname="x86_64"; expected_node_arch="x64"; expected_machine="Advanced Micro Devices X86-64" ;;
            aarch64) expected_uname="aarch64"; expected_node_arch="arm64"; expected_machine="AArch64" ;;
            *) echo "unsupported architecture: ${architecture}" >&2; exit 1 ;;
          esac
          test "$(uname -m)" = "${expected_uname}"
          test "$(rustc -vV | sed -n 's/^host: //p')" = "${expected_uname}-unknown-linux-gnu"
          test "$(node -p 'process.arch')" = "${expected_node_arch}"
          readelf -h target/release/sedna-browser-mcp | grep -E "Machine:.*${expected_machine}"
          package_name="sedna-browser-mcp-0.1.0-linux-${architecture}-ubuntu24.04-${GITHUB_SHA}"
          package_root="${RUNNER_TEMP}/${package_name}"
          browser_root="${RUNNER_TEMP}/sedna-browser-mcp-playwright-browsers"
          mkdir -p "${package_root}/target/release" "${package_root}/scripts" "${package_root}/runtime"
          cp target/release/sedna-browser-mcp "${package_root}/target/release/"
          cp scripts/start.mjs "${package_root}/scripts/"
          cp package.json package-lock.json LICENSE NOTICE "${package_root}/"
          cp -a worker node_modules "${package_root}/"
          cp -a "${browser_root}" "${package_root}/runtime/ms-playwright"
          printf 'source_commit=%s\npackage_version=0.1.0\nrunner=%s\narchitecture=%s\nnode=%s\nnode_arch=%s\nrust=%s\n' \
            "${GITHUB_SHA}" "${{ matrix.architecture == 'aarch64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}" \
            "${architecture}" "$(node --version)" "$(node -p 'process.arch')" "$(rustc --version)" > "${package_root}/BUILD-INFO.txt"
          test -x "${package_root}/target/release/sedna-browser-mcp"
          test -f "${package_root}/scripts/start.mjs"
          test -f "${package_root}/worker/main.mjs"
          test -f "${package_root}/node_modules/playwright/index.mjs"
          test -d "${package_root}/runtime/ms-playwright"
          node "${package_root}/scripts/start.mjs" --version
          artifact="${RUNNER_TEMP}/${package_name}.tar.gz"
          tar -C "${RUNNER_TEMP}" -czf "${artifact}" "${package_name}"
          (cd "${RUNNER_TEMP}" && sha256sum "${package_name}.tar.gz" > "${package_name}.tar.gz.sha256")
          echo "artifact_path=${artifact}" >> "${GITHUB_OUTPUT}"
          echo "checksum_path=${artifact}.sha256" >> "${GITHUB_OUTPUT}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sedna-browser-mcp-linux-${{ matrix.architecture }}-${{ github.sha }}
          path: |
            ${{ steps.package.outputs.artifact_path }}
            ${{ steps.package.outputs.checksum_path }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
