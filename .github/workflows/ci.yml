name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: Install Rust toolchain
        run: rustup show active-toolchain
      - name: Reject unresolved dependency graph
        run: test ! -e Cargo.lock.pending
      - name: Install locked JavaScript dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify shared tool schemas
        run: npm run check:catalog
      - name: Check Rust formatting
        run: cargo fmt --all -- --check
      - name: Compile and test Rust host
        run: cargo test --locked --all-targets
      - name: Verify stdio-only compilation
        run: cargo test --locked --no-default-features --lib
      - name: Check Rust warnings
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Install test browser and Linux libraries
        run: npx playwright install --with-deps chromium
      - name: Exercise worker and actual MCP browser calls
        run: npm test
        env:
          SEDNA_BROWSER_BINARY: ${{ github.workspace }}/target/debug/sedna-browser-mcp
      - name: Verify source packaging
        run: python3 scripts/package.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: success()
        with:
          name: sedna-browser-mcp-source
          path: dist/*-source.zip
          if-no-files-found: error
          retention-days: 14
