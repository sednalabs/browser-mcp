name: Resolve HTTP Cargo lockfile (temporary)

on:
  push:
    branches:
      - feat/initial-browser-mcp-http
    paths:
      - .github/workflows/resolve-cargo-lock.yml

permissions:
  contents: write

jobs:
  resolve:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - name: Verify selected Rust toolchain
        run: rustup show active-toolchain
      - name: Resolve and reconcile lockfile with Cargo
        run: node scripts/prepare.mjs
      - name: Confirm no unresolved dependency marker remains
        run: |
          test ! -e Cargo.lock.pending
          git diff --check
          git diff --stat
      - name: Commit the generated lock and manifest
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock SOURCE_MANIFEST.json
          git add -u Cargo.lock.pending
          if git diff --cached --quiet; then
            echo "No lockfile changes were needed"
          else
            git commit -m "build: resolve HTTP dependency lockfile with Cargo"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
